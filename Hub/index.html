<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenTech Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
    .nav-links { display: flex; gap: 16px; margin-bottom: 32px; font-size: 0.85rem; }
    .nav-links a { color: #64748b; text-decoration: none; }
    .nav-links a:hover { color: #06b6d4; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 500px; width: 100%; }
    a.card {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: #111119; border: 1px solid #1a1a2e; border-radius: 14px; padding: 24px;
      text-decoration: none; color: #e0e0e0; transition: all 0.2s;
    }
    a.card:hover { background: #16161f; border-color: #06b6d4; transform: translateY(-2px); }
    .card .icon { font-size: 2rem; margin-bottom: 8px; }
    .card .name { font-weight: 700; font-size: 1rem; }
    .card .desc { color: #64748b; font-size: 0.8rem; margin-top: 2px; }
    .footer { margin-top: 32px; color: #374151; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>🌐 GenTech Hub</h1>
  <div class="subtitle">Team dashboards and resources</div>
  <div class="nav-links">
    <a href="../">Portfolio</a>
    <a href="../Jordan/">Jordan</a>
    <a href="../Vanito/">Vanito</a>
    <a href="../Games/">Projects</a>
  </div>
  <div class="grid">
    <a class="card" href="../Jordan/">
      <div class="icon">🧑‍💻</div>
      <div class="name">Jordan's Hub</div>
      <div class="desc">GenTech Atlas, DeFi, gaming stats</div>
    </a>
    <a class="card" href="../Vanito/">
      <div class="icon">🕶️</div>
      <div class="name">Vanito's Hub</div>
      <div class="desc">Travel companion, music, games</div>
    </a>
    <a class="card" href="../Games/">
      <div class="icon">🎯</div>
      <div class="name">Projects</div>
      <div class="desc">All GenTech project pages</div>
    </a>
    <a class="card" href="https://gentechlabs.net" target="_blank">
      <div class="icon">🧪</div>
      <div class="name">Labs</div>
      <div class="desc">x402 APIs and agent services</div>
    </a>
  </div>
  <div class="footer">GenTech Labs</div>
</body>
</html>
