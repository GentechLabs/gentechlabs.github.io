<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christel's Hub — GenTech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 32px;
        }
        .link-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
            text-decoration: none;
            display: block;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border-color: #667eea;
        }
        .link-icon {
            font-size: 2em;
            margin-bottom: 8px;
        }
        .link-title {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }
        .link-desc {
            color: #666;
            font-size: 0.85em;
            margin-top: 4px;
        }
        .footer {
            margin-top: 24px;
            color: #888;
            font-size: 0.75em;
        }
        .message {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            text-align: left;
            font-size: 0.85em;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🌸 Christel's Hub</h1>
            <p class="subtitle">Your personal space for Jordan's arrival</p>
            
            <a href="christel-kitchen.html" class="link-card">
                <div class="link-icon">📖</div>
                <div class="link-title">Cookbook</div>
                <div class="link-desc">Recipes and meal planning</div>
            </a>
            
            <a href="shopping-list.html" class="link-card">
                <div class="link-icon">🛍️</div>
                <div class="link-title">Shopping List</div>
                <div class="link-desc">Jordan arrival prep — Shopee tracking</div>
            </a>
            
            <div class="footer">
                GenTech • Built with 💕
            </div>
        </div>
    </div>
</body>
</html>
