<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenTech Journal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e0d8cc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh; }
    #app { display: flex; height: 100vh; }

    /* Sidebar */
    #sidebar { width: 320px; background: #0f0f18; border-right: 1px solid #1a1a2e; display: flex; flex-direction: column; flex-shrink: 0; }
    #sidebar h1 { padding: 20px; font-size: 18px; color: #d4a017; letter-spacing: 1px; border-bottom: 1px solid #1a1a2e; }
    #sidebar h1 span { color: #666; font-size: 12px; display: block; margin-top: 2px; letter-spacing: 0; }
    #entry-list { flex: 1; overflow-y: auto; padding: 8px; }
    .entry-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; transition: all .15s; }
    .entry-item:hover { background: #14141f; border-color: #1a1a2e; }
    .entry-item.active { background: #1a1a2e; border-color: #d4a01733; }
    .entry-item .title { font-size: 14px; font-weight: 500; color: #e0d8cc; }
    .entry-item .preview { font-size: 12px; color: #666; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-item .meta { font-size: 11px; color: #444; margin-top: 4px; }
    .entry-item .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
    .tag-idea { background: #1a3a2e; color: #4ade80; }
    .tag-work { background: #2e1a3a; color: #c084fc; }
    .tag-venting { background: #3a1a1a; color: #f87171; }
    .tag-learning { background: #1a2e3a; color: #60a5fa; }
    .tag-personal { background: #2e2e1a; color: #fbbf24; }

    #new-entry-btn { margin: 8px; padding: 10px; background: #d4a017; color: #0a0a0f; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    #new-entry-btn:hover { background: #e0b020; }

    /* Main */
    #main { flex: 1; display: flex; flex-direction: column; position: relative; }
    #editor-area { flex: 1; display: flex; flex-direction: column; padding: 0; }
    #editor-header { padding: 16px 24px; border-bottom: 1px solid #1a1a2e; display: flex; gap: 12px; align-items: center; }
    #entry-title { flex: 1; background: transparent; border: none; color: #e0d8cc; font-size: 20px; font-weight: 600; outline: none; padding: 4px 0; }
    #entry-title::placeholder { color: #333; }
    .tag-select { background: #14141f; color: #e0d8cc; border: 1px solid #1a1a2e; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    #entry-body { flex: 1; background: transparent; border: none; color: #c0b8a8; font-size: 15px; line-height: 1.7; outline: none; padding: 24px; resize: none; font-family: inherit; }
    #entry-body::placeholder { color: #333; }

    /* Map view */
    #map-view { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
    #map-canvas { width: 100%; height: 100%; }
    #map-toggle { position: absolute; bottom: 20px; right: 20px; background: #14141f; border: 1px solid #1a1a2e; color: #d4a017; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; z-index: 10; pointer-events: all; }
    #map-toggle:hover { background: #1a1a2e; }

    /* Empty state */
    #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: #333; }
    #empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    #empty-state h2 { font-size: 18px; color: #555; margin-bottom: 8px; }
    #empty-state p { font-size: 13px; color: #333; max-width: 300px; text-align: center; }
  </style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>Journal<span>think out loud</span></h1>
    <button id="new-entry-btn">+ New Entry</button>
    <div id="entry-list"></div>
  </div>
  <div id="main">
    <div id="map-view"><canvas id="map-canvas"></canvas></div>
    <div id="editor-area" style="display:none; position:relative; z-index:5;">
      <div id="editor-header">
        <input id="entry-title" placeholder="What's on your mind?" />
        <select class="tag-select" id="entry-tag">
          <option value="idea">💡 Idea</option>
          <option value="work">⚡ Work</option>
          <option value="venting">💢 Venting</option>
          <option value="learning">📚 Learning</option>
          <option value="personal">🌟 Personal</option>
        </select>
      </div>
      <textarea id="entry-body" placeholder="Write your thoughts..."></textarea>
    </div>
    <div id="empty-state">
      <div class="icon">📓</div>
      <h2>Start thinking out loud</h2>
      <p>Write notes, discuss ideas, vent, brainstorm — your thoughts become a living map.</p>
    </div>
    <button id="map-toggle">🌐 Toggle Map</button>
  </div>
</div>
<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'gentech_journal';
  let entries = [];
  let activeId = null;
  let mapVisible = true;

  // Load
  try { entries = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { entries = []; }

  // Seed demo data if empty
  if (entries.length === 0) {
    entries = [
      { id: '1', title: 'GenTech Atlas idea', body: 'What if travelers wearing Meta Ray-Bans could contribute street-level data and earn from it? Two-sided marketplace: Virtual Explorers pay, Field Agents contribute. The data flywheel.', tag: 'idea', created: Date.now() - 86400000 * 3 },
      { id: '2', title: 'Revenue model thoughts', body: 'Selling intelligence, not subscriptions. Open source to win adoption, paid APIs for revenue. x402 micropayments are the key — agents pay per call, no billing overhead.', tag: 'work', created: Date.now() - 86400000 * 2 },
      { id: '3', title: 'Vanito\'s travel game', body: 'He wants Japan. Tokyo and Osaka for now. Keep his project separate from GenTech Atlas — two different things. He drives content, we build the engine.', tag: 'personal', created: Date.now() - 86400000 },
      { id: '4', title: 'PixelRAG on laptop', body: 'RTX 3070 handles GPU embedding. Pipeline: pixelshot → chunk → embed (Qwen3-VL-Embedding-2B) → FAISS index. ~1-2s per chunk on GPU vs 28s on CPU.', tag: 'learning', created: Date.now() - 3600000 },
      { id: '5', title: 'Coinbase acting up', body: 'Sent USDC to Atelier wallet hours ago, still hasn\'t landed. Solana withdrawal pending. Need to check tomorrow.', tag: 'venting', created: Date.now() - 1800000 },
    ];
    save();
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }

  function renderList() {
    const list = document.getElementById('entry-list');
    list.innerHTML = entries.slice().reverse().map(e => {
      const date = new Date(e.created).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const preview = (e.body || '').substring(0, 80);
      return `<div class="entry-item ${activeId === e.id ? 'active' : ''}" data-id="${e.id}">
        <div class="title">${escapeHtml(e.title || 'Untitled')}</div>
        <div class="preview">${escapeHtml(preview)}${preview.length >= 80 ? '...' : ''}</div>
        <div class="meta"><span class="tag tag-${e.tag}">${e.tag}</span> ${date}</div>
      </div>`;
    }).join('');
    document.querySelectorAll('.entry-item').forEach(el => {
      el.addEventListener('click', () => openEntry(el.dataset.id));
    });
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function openEntry(id) {
    activeId = id;
    const e = entries.find(x => x.id === id);
    if (!e) return;
    document.getElementById('editor-area').style.display = 'flex';
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('entry-title').value = e.title || '';
    document.getElementById('entry-body').value = e.body || '';
    document.getElementById('entry-tag').value = e.tag || 'idea';
    renderList();
    drawMap();
  }

  function newEntry() {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    entries.push({ id, title: '', body: '', tag: 'idea', created: Date.now() });
    save();
    openEntry(id);
    document.getElementById('entry-title').focus();
  }

  function saveCurrent() {
    if (!activeId) return;
    const e = entries.find(x => x.id === activeId);
    if (!e) return;
    e.title = document.getElementById('entry-title').value;
    e.body = document.getElementById('entry-body').value;
    e.tag = document.getElementById('entry-tag').value;
    save();
    renderList();
    drawMap();
  }

  // Auto-save on input
  let saveTimer;
  document.getElementById('entry-title').addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveCurrent, 500); });
  document.getElementById('entry-body').addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveCurrent, 500); });
  document.getElementById('entry-tag').addEventListener('change', saveCurrent);

  document.getElementById('new-entry-btn').addEventListener('click', newEntry);

  // Map
  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function drawMap() {
    if (!mapVisible) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const w = canvas.width, h = canvas.height;
    const cx = w / 2, cy = h / 2;
    const colors = { idea: '#4ade80', work: '#c084fc', venting: '#f87171', learning: '#60a5fa', personal: '#fbbf24' };

    if (entries.length === 0) return;

    // Draw connections
    const angleStep = (Math.PI * 2) / entries.length;
    const radius = Math.min(w, h) * 0.3;

    entries.forEach((e, i) => {
      const angle = angleStep * i - Math.PI / 2;
      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;

      // Connection to center
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.strokeStyle = colors[e.tag] + '15';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Node
      const size = Math.max(6, Math.min(20, (e.body || '').length / 50));
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = colors[e.tag] + '40';
      ctx.fill();
      ctx.strokeStyle = colors[e.tag] + '80';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Label
      if (e.title) {
        ctx.fillStyle = '#888';
        ctx.font = '10px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(e.title.substring(0, 20), x, y + size + 12);
      }
    });

    // Center glow
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
    grad.addColorStop(0, '#d4a01720');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, 40, 0, Math.PI * 2);
    ctx.fill();
  }

  document.getElementById('map-toggle').addEventListener('click', () => {
    mapVisible = !mapVisible;
    document.getElementById('map-toggle').textContent = mapVisible ? '🌐 Toggle Map' : '🌐 Show Map';
    drawMap();
  });

  // Initial render
  renderList();
  if (entries.length > 0) openEntry(entries[entries.length - 1].id);
  drawMap();
  setInterval(drawMap, 5000);
})();
</script>
</body>
</html>
