<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b5cf6">
<title>{SURFACE} — GenTech</title>
<link rel="manifest" href="/{SURFACE_PATH}/manifest.json">
<link rel="apple-touch-icon" href="/{SURFACE_PATH}/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b; --surface: #101014; --border: #1f1f23;
    --text: #fafafa; --text-sec: #a1a1aa; --accent: #8b5cf6; --accent2: #22d3ee;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; min-height: 100vh;
    background-image: radial-gradient(1200px 600px at 50% -10%, rgba(139,92,246,0.15), transparent 60%);
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .logo { font-weight: 700; font-size: 20px; }
  .logo span { color: var(--accent); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .badge { background: rgba(139,92,246,0.15); color: var(--accent); border: 1px solid rgba(139,92,246,0.3);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
  .sub { color: var(--text-sec); margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .card h3 { font-size: 16px; margin-bottom: 6px; }
  .card p { color: var(--text-sec); font-size: 13px; line-height: 1.5; }
  /* Chat FAB */
  .fab { position: fixed; right: 20px; bottom: 20px; width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff;
    font-size: 24px; cursor: pointer; box-shadow: 0 8px 24px rgba(139,92,246,0.4); z-index: 100; }
  .chat { position: fixed; right: 20px; bottom: 84px; width: 340px; max-width: calc(100vw - 40px);
    height: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    display: none; flex-direction: column; overflow: hidden; z-index: 100; }
  .chat.open { display: flex; }
  .chat-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; }
  .chat-body { flex: 1; padding: 12px 16px; overflow-y: auto; font-size: 13px; }
  .chat-body .msg { margin-bottom: 10px; }
  .chat-body .bot { color: var(--text-sec); }
  .chat-in { display: flex; border-top: 1px solid var(--border); }
  .chat-in input { flex: 1; background: transparent; border: none; padding: 14px 16px; color: var(--text); outline: none; font-size: 13px; }
  .chat-in button { background: var(--accent); border: none; color: #fff; padding: 0 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">GenTech <span>{SURFACE}</span></div>
    <span class="badge mono">PWA</span>
  </header>
  <h1>{SURFACE_TITLE}</h1>
  <p class="sub mono" id="state-sub">{SURFACE_DESCRIPTION}</p>
  <div class="grid" id="cards">
    <!-- Surface-specific cards injected here -->
  </div>
</div>

<!-- Chat FAB -->
<button class="fab" id="fab" title="Chat">💬</button>
<div class="chat" id="chat">
  <div class="chat-head">{SURFACE} · Bridge</div>
  <div class="chat-body" id="chatBody"><div class="msg bot">Ask {SURFACE} anything.</div></div>
  <div class="chat-in">
    <input id="chatInput" placeholder="Type a message...">
    <button id="chatSend">Send</button>
  </div>
</div>

<script>
// PWA: register service worker
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/{SURFACE_PATH}/sw.js").catch(() => {});
}

// Chat bridge — same-origin via nginx /bridge/ proxy
const BRIDGE = "/bridge";
const fab = document.getElementById("fab");
const chat = document.getElementById("chat");
const body = document.getElementById("chatBody");
const input = document.getElementById("chatInput");

fab.addEventListener("click", () => {
  chat.classList.toggle("open");
  if (chat.classList.contains("open")) input.focus();
});

async function send() {
  const text = input.value.trim();
  if (!text) return;
  body.innerHTML += `<div class="msg"><b>You:</b> ${text}</div>`;
  input.value = "";
  try {
    const session = await fetch(`${BRIDGE}/api/session`, { method: "POST" }).then(r => r.json());
    const sid = session.sessionId || session.id || "";
    const res = await fetch(`${BRIDGE}/api/chat?dept={DEPT}${sid ? "&sessionId=" + sid : ""}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    }).then(r => r.json());
    const reply = res.response || res.message || res.text || "…";
    body.innerHTML += `<div class="msg bot"><b>{SURFACE}:</b> ${reply}</div>`;
  } catch (e) {
    body.innerHTML += `<div class="msg bot">Bridge unavailable: ${e.message}</div>`;
  }
  body.scrollTop = body.scrollHeight;
}
document.getElementById("chatSend").addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
