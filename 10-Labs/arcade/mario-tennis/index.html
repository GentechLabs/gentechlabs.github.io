<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Super Arcade Tennis — GenTech Labs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; }
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  #score { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 32px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  #score span { margin: 0 30px; }
  #score .p1 { color: #4fc3f7; }
  #score .p2 { color: #ff7043; }
  #score .divider { color: rgba(255,255,255,0.3); font-weight: 300; }
  #info { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 14px; text-align: center; pointer-events: none; }
  #serve-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 28px; font-weight: 700; opacity: 0; transition: opacity 0.3s; text-shadow: 0 2px 12px rgba(0,0,0,0.9); letter-spacing: 1px; }
  #serve-hint.show { opacity: 1; }
  #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 48px; font-weight: 900; text-align: center; opacity: 0; transition: opacity 0.5s; text-shadow: 0 4px 20px rgba(0,0,0,0.9); }
  #game-over.show { opacity: 1; }
  #game-over .sub { font-size: 20px; font-weight: 400; margin-top: 10px; opacity: 0.7; }
  #game-over .restart { font-size: 18px; margin-top: 20px; color: #4fc3f7; cursor: pointer; pointer-events: auto; }
  .powerup-icon { position: absolute; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .powerup-icon.show { opacity: 1; }
  .powerup-icon.p1 { top: 100px; left: 80px; background: rgba(79,195,247,0.3); border: 2px solid #4fc3f7; }
  .powerup-icon.p2 { top: 100px; right: 80px; background: rgba(255,112,67,0.3); border: 2px solid #ff7043; }
</style>
</head>
<body>

<div id="ui">
  <div id="score"><span class="p1" id="p1-score">0</span><span class="divider">|</span><span class="p2" id="p2-score">0</span></div>
  <div id="serve-hint">PRESS SPACE TO SERVE</div>
  <div id="game-over"><span id="winner-text">PLAYER WINS!</span><div class="sub" id="final-score">6-4</div><div class="restart" id="restart-btn">▶ PLAY AGAIN</div></div>
  <div id="info">WASD · SPACE to swing · First to 6 wins</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// === SETUP ===
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.Fog(0x0a0a1a, 30, 60);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(18, 16, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.prepend(renderer.domElement);

// === LIGHTS ===
const ambient = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffeedd, 2.5);
dirLight.position.set(15, 25, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 50;
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
fillLight.position.set(-10, 10, -8);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x4fc3f7, 0.3);
rimLight.position.set(-5, 5, 15);
scene.add(rimLight);

// === COURT ===
const courtGroup = new THREE.Group();

// Court surface
const courtGeo = new THREE.BoxGeometry(14, 0.3, 20);
const courtMat = new THREE.MeshStandardMaterial({ 
  color: 0x1a6b3c, 
  roughness: 0.7, 
  metalness: 0.1
});
const court = new THREE.Mesh(courtGeo, courtMat);
court.position.y = -0.15;
court.receiveShadow = true;
courtGroup.add(court);

// Court border / clay area
const borderMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 1 });
const border = new THREE.Mesh(new THREE.BoxGeometry(15, 0.1, 21), borderMat);
border.position.y = -0.3;
courtGroup.add(border);

// Lines
const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
const lineY = 0.01;

function addLine(x, z, w, h) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, h), lineMat);
  mesh.position.set(x, lineY, z);
  courtGroup.add(mesh);
}

// Court lines
addLine(0, -9.8, 13.6, 0.06);  // back top
addLine(0, 9.8, 13.6, 0.06);   // back bottom
addLine(-6.8, 0, 0.06, 19.6);  // left side
addLine(6.8, 0, 0.06, 19.6);   // right side
addLine(0, 0, 13.6, 0.06);     // net line (under net)
addLine(0, -3.5, 13.6, 0.04);  // service line top
addLine(0, 3.5, 13.6, 0.04);   // service line bottom
// Center service line
addLine(0, -6.65, 0.04, 6.3);  // top half center
addLine(0, 6.65, 0.04, 6.3);   // bottom half center

// Doubles sidelines
addLine(-7.3, 0, 0.04, 19.6);
addLine(7.3, 0, 0.04, 19.6);

// Net
const netMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8, transparent: true, opacity: 0.6, wireframe: false });
const net = new THREE.Mesh(new THREE.BoxGeometry(13.8, 1.2, 0.06), netMat);
net.position.set(0, 0.6, 0);
net.castShadow = true;
courtGroup.add(net);

// Net poles
const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.6, roughness: 0.3 });
for (let x of [-6.9, 6.9]) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.3, 8), poleMat);
  pole.position.set(x, 0.65, 0);
  courtGroup.add(pole);
}

// Net top band
const bandMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
const band = new THREE.Mesh(new THREE.BoxGeometry(13.8, 0.06, 0.08), bandMat);
band.position.set(0, 1.2, 0);
courtGroup.add(band);

scene.add(courtGroup);

// === STADIUM / BACKGROUND ===
// Simple arena columns
const colMat = new THREE.MeshStandardMaterial({ color: 0x2a2a4a, roughness: 0.8, metalness: 0.1 });
for (let angle = 0; angle < 8; angle++) {
  const rad = (angle / 8) * Math.PI * 2;
  const r = 14;
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 4, 8), colMat);
  col.position.set(Math.sin(rad) * r, 2, Math.cos(rad) * r);
  col.castShadow = true;
  scene.add(col);
  
  // Light glow at top
  const glowMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, emissive: 0x4fc3f7, emissiveIntensity: 0.3, transparent: true, opacity: 0.3 });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), glowMat);
  glow.position.set(Math.sin(rad) * r, 4.2, Math.cos(rad) * r);
  scene.add(glow);
}

// Ground plane (arena floor)
const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.35;
ground.receiveShadow = true;
scene.add(ground);

// === PLAYERS ===
function createPlayer(x, z, color, isAI = false) {
  const group = new THREE.Group();
  
  // Body
  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.1 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.2, 8), bodyMat);
  body.position.y = 0.6;
  body.castShadow = true;
  group.add(body);
  
  // Head
  const headMat = new THREE.MeshStandardMaterial({ color: 0xffddbb, roughness: 0.5 });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), headMat);
  head.position.y = 1.3;
  head.castShadow = true;
  group.add(head);
  
  // Visor (Mario hat style)
  const visorMat = new THREE.MeshStandardMaterial({ color: isAI ? 0xff4400 : 0x0044ff, roughness: 0.7 });
  const visor = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.15, 8), visorMat);
  visor.position.set(0, 1.5, 0.1);
  visor.rotation.x = 0.2;
  group.add(visor);
  
  // Racket arm
  const armMat = new THREE.MeshStandardMaterial({ color: 0xffddbb, roughness: 0.5 });
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 6), armMat);
  arm.position.set(0.4, 0.9, 0);
  arm.rotation.z = -0.5;
  arm.rotation.x = -0.3;
  group.add(arm);
  
  // Racket
  const racketMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.3, metalness: 0.2 });
  const racket = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 4), new THREE.MeshStandardMaterial({ color: 0x888888 }));
  racket.position.set(0.6, 1.0, 0);
  racket.rotation.z = -0.8;
  group.add(racket);
  
  const racketHead = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), racketMat);
  racketHead.position.set(0.7, 1.1, 0);
  group.add(racketHead);
  
  group.position.set(x, 0, z);
  group.userData = {
    racketGroup: group,
    swingAngle: 0,
    isSwinging: false,
    swingTimer: 0,
    moveSpeed: isAI ? 0.12 : 0,
    isAI
  };
  
  return group;
}

const player = createPlayer(0, -5, 0x2196f3, false);
scene.add(player);

const ai = createPlayer(0, 5, 0xff5722, true);
scene.add(ai);

// === BALL ===
const ballMat = new THREE.MeshStandardMaterial({ 
  color: 0xffffff, 
  roughness: 0.2, 
  metalness: 0.1,
  emissive: 0xffffaa,
  emissiveIntensity: 0.1
});
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), ballMat);
ball.castShadow = true;
scene.add(ball);

// Ball trail
const trailPositions = [];
const trailMat = new THREE.MeshBasicMaterial({ color: 0xffffaa, transparent: true, opacity: 0.3 });
const trailGroup = new THREE.Group();
scene.add(trailGroup);

// === GAME STATE ===
const state = {
  ballPos: new THREE.Vector3(0, 0.5, 0),
  ballVel: new THREE.Vector3(0, 0, 0),
  ballActive: false,
  p1Score: 0,
  p2Score: 0,
  serving: true,
  server: 0, // 0 = player, 1 = AI
  rallyCount: 0,
  gameOver: false,
  serveTimer: 0,
  aiHitTimer: 0,
  aiSwingCooldown: 0,
  powerUp: null,
  powerUpTimer: 0
};

// Player input
const keys = {};
document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// === GAME FUNCTIONS ===

function resetBall(serverPlayer) {
  state.ballActive = false;
  state.serving = true;
  state.server = serverPlayer;
  state.serveTimer = 1.5;
  
  if (serverPlayer === 0) {
    ball.position.set(0, 0.5, -5);
    state.ballPos.set(0, 0.5, -5);
    state.ballVel.set(0, 0, 0);
    document.getElementById('serve-hint').textContent = 'PRESS SPACE TO SERVE';
    document.getElementById('serve-hint').classList.add('show');
  } else {
    ball.position.set(0, 0.5, 5);
    state.ballPos.set(0, 0.5, 5);
    state.ballVel.set(0, 0, 0);
    document.getElementById('serve-hint').textContent = 'AI SERVING...';
    document.getElementById('serve-hint').classList.add('show');
    state.aiHitTimer = 1.0;
  }
}

function serveBall() {
  if (state.gameOver) return;
  state.ballActive = true;
  state.serving = false;
  state.rallyCount = 0;
  document.getElementById('serve-hint').classList.remove('show');
  
  // Serve toward opponent
  const dir = state.server === 0 ? -1 : 1;
  const spread = (Math.random() - 0.5) * 0.3;
  state.ballVel.set(spread * 3, 0.8, dir * 6);
}

function hitBall(fromPlayer, hitZ) {
  const dir = fromPlayer === player ? -1 : 1;
  const spread = (Math.random() - 0.5) * 0.2;
  const power = 0.7 + Math.random() * 0.3;
  
  state.ballVel.set(
    spread * 4,
    0.3 + Math.random() * 0.5,
    dir * (5 + state.rallyCount * 0.1) * power
  );
  
  state.rallyCount++;
  
  // Swing animation
  fromPlayer.userData.isSwinging = true;
  fromPlayer.userData.swingTimer = 0.3;
  
  // Power-up check
  if (state.powerUp && state.powerUpTimer > 0) {
    state.ballVel.multiplyScalar(1.3);
    ballMat.color.setHex(0xff4400);
    ballMat.emissive.setHex(0xff4400);
    ballMat.emissiveIntensity = 0.5;
    setTimeout(() => {
      ballMat.color.setHex(0xffffff);
      ballMat.emissive.setHex(0xffffaa);
      ballMat.emissiveIntensity = 0.1;
    }, 500);
    state.powerUpTimer = 0;
  }
}

function scorePoint(scorer) {
  if (state.gameOver) return;
  
  if (scorer === 0) {
    state.p1Score++;
    document.getElementById('p1-score').textContent = state.p1Score;
  } else {
    state.p2Score++;
    document.getElementById('p2-score').textContent = state.p2Score;
  }
  
  // Check win
  if (state.p1Score >= 6) {
    endGame(0);
    return;
  } else if (state.p2Score >= 6) {
    endGame(1);
    return;
  }
  
  // Alternate serve every 2 points
  const totalPoints = state.p1Score + state.p2Score;
  const nextServer = Math.floor(totalPoints / 2) % 2;
  resetBall(nextServer);
}

function endGame(winner) {
  state.gameOver = true;
  document.getElementById('winner-text').textContent = winner === 0 ? 'YOU WIN!' : 'AI WINS!';
  document.getElementById('final-score').textContent = `${state.p1Score} - ${state.p2Score}`;
  document.getElementById('game-over').classList.add('show');
}

document.getElementById('restart-btn').addEventListener('click', () => {
  state.p1Score = 0;
  state.p2Score = 0;
  state.gameOver = false;
  document.getElementById('p1-score').textContent = '0';
  document.getElementById('p2-score').textContent = '0';
  document.getElementById('game-over').classList.remove('show');
  resetBall(0);
});

// === AI ===
function updateAI(delta) {
  if (state.gameOver) return;
  
  const aiPos = ai.position;
  const ballPos = state.ballPos;
  
  // Track ball on AI's side
  if (ballPos.z > 0 && state.ballActive) {
    // Move toward ball's x position
    const dx = ballPos.x - aiPos.x;
    aiPos.x += Math.sign(dx) * Math.min(Math.abs(dx) * 2, 0.12);
    aiPos.x = Math.max(-5.5, Math.min(5.5, aiPos.x));
    
    // Move z toward ball's landing zone
    const targetZ = Math.min(ballPos.z + 1, 7);
    const dz = targetZ - aiPos.z;
    aiPos.z += Math.sign(dz) * Math.min(Math.abs(dz), 0.08);
    
    // Hit when ball is in range
    const dist = aiPos.distanceTo(ballPos);
    if (dist < 1.0 && ballPos.z > 1.5 && state.aiSwingCooldown <= 0) {
      hitBall(ai, aiPos.z);
      state.aiSwingCooldown = 0.5;
    }
  } else {
    // Return to center
    aiPos.x += (0 - aiPos.x) * 0.02;
    aiPos.z += (5 - aiPos.z) * 0.02;
  }
  
  state.aiSwingCooldown -= delta;
}

// === PLAYER CONTROLS ===
function updatePlayer(delta) {
  if (state.gameOver) return;
  
  const speed = 0.15;
  let dx = 0, dz = 0;
  if (keys['w'] || keys['arrowup']) dz -= speed;
  if (keys['s'] || keys['arrowdown']) dz += speed;
  if (keys['a'] || keys['arrowleft']) dx -= speed;
  if (keys['d'] || keys['arrowright']) dx += speed;
  
  if (dx !== 0 || dz !== 0) {
    const len = Math.sqrt(dx*dx + dz*dz);
    player.position.x += dx / len * speed;
    player.position.z += dz / len * speed;
  }
  
  // Clamp to court
  player.position.x = Math.max(-6, Math.min(6, player.position.x));
  player.position.z = Math.max(-8, Math.min(-1, player.position.z));
  
  // Swing
  if (keys[' '] && !state.gameOver) {
    if (state.serving && state.server === 0) {
      serveBall();
    } else if (state.ballActive && !player.userData.isSwinging) {
      const dist = player.position.distanceTo(ball.position);
      if (dist < 1.2 && ball.position.z < 0) {
        hitBall(player, player.position.z);
      }
    }
  }
}

// === UPDATE LOOP ===
const clock = new THREE.Clock();

function update() {
  const delta = Math.min(clock.getDelta(), 0.05);
  
  // Serve timer
  if (state.serving && state.server === 1) {
    state.aiHitTimer -= delta;
    if (state.aiHitTimer <= 0) {
      serveBall();
    }
  }
  
  if (state.ballActive && !state.gameOver) {
    // Gravity
    state.ballVel.y -= 1.5 * delta;
    
    // Update position
    state.ballPos.x += state.ballVel.x * delta;
    state.ballPos.y += state.ballVel.y * delta;
    state.ballPos.z += state.ballVel.z * delta;
    
    // Floor bounce
    if (state.ballPos.y < 0.15) {
      state.ballPos.y = 0.15;
      state.ballVel.y *= 0.6;
      if (Math.abs(state.ballVel.y) < 0.1) state.ballVel.y = 0;
    }
    
    // Wall bounces (side)
    if (Math.abs(state.ballPos.x) > 6.5) {
      state.ballPos.x = Math.sign(state.ballPos.x) * 6.5;
      state.ballVel.x *= -0.8;
    }
    
    // Out of bounds (past player)
    if (state.ballPos.z < -9) {
      scorePoint(1); // AI scores
      return;
    }
    if (state.ballPos.z > 9) {
      scorePoint(0); // Player scores
      return;
    }
    
    // Net collision
    if (Math.abs(state.ballPos.z) < 0.08 && state.ballPos.y < 1.3) {
      state.ballVel.z *= -0.3;
      state.ballVel.x *= 0.5;
      state.ballPos.z = Math.sign(state.ballPos.z) * 0.08;
    }
    
    ball.position.copy(state.ballPos);
    
    // Trail
    trailPositions.push(state.ballPos.clone());
    if (trailPositions.length > 15) trailPositions.shift();
    
    // Clear trail
    while (trailGroup.children.length > 0) {
      trailGroup.remove(trailGroup.children[0]);
    }
    
    // Rebuild trail
    for (let i = 0; i < trailPositions.length; i++) {
      const alpha = (i / trailPositions.length) * 0.4;
      const trailMat2 = new THREE.MeshBasicMaterial({ 
        color: 0xffffaa, transparent: true, opacity: alpha 
      });
      const trailBall = new THREE.Mesh(new THREE.SphereGeometry(0.04 * (i / trailPositions.length + 0.5), 4), trailMat2);
      trailBall.position.copy(trailPositions[i]);
      trailGroup.add(trailBall);
    }
  }
  
  // Update AI
  updateAI(delta);
  updatePlayer(delta);
  
  // Swing animation
  for (let p of [player, ai]) {
    if (p.userData.isSwinging) {
      p.userData.swingTimer -= delta;
      const arm = p.children[3]; // arm
      if (arm) {
        arm.rotation.x = -0.3 - (p.userData.swingTimer / 0.3) * 1.5;
        arm.rotation.z = -0.5 - (p.userData.swingTimer / 0.3) * 0.5;
      }
      if (p.userData.swingTimer <= 0) {
        p.userData.isSwinging = false;
        const arm2 = p.children[3];
        if (arm2) {
          arm2.rotation.x = -0.3;
          arm2.rotation.z = -0.5;
        }
      }
    }
  }
  
  // Camera sway
  const time = Date.now() * 0.001;
  camera.position.x = 18 + Math.sin(time * 0.02) * 0.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(update);
}

// === RESIZE ===
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// === START ===
resetBall(0);
update();

// Dev controls for testing
console.log('Super Arcade Tennis — GenTech Labs');
console.log('WASD to move · SPACE to swing/serve');

</script>
</body>
</html>
