version: "1"
kind: subnet
id: 1002
slug: gentech-wallet-analysis
protocol: generic
name: GenTech Wallet Analysis
description: >
  Wallet portfolio analysis with token balances and USD valuation on Solana.
  Returns a verified portfolio snapshot agents can use to assess counterparty
  holdings and risk before transacting.
base_url: https://api.gentechlabs.net

auth:
  type: none

rate_limit_per_sec: 5
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /v1/wallet/portfolio/{address}
    external_path: /v1/wallet/portfolio/{address}
    method: GET
    description: Wallet portfolio analysis with token balances and USD valuation.

semantics:
  signal_mapping:
    type: wallet_analysis
    confidence_field: confidence
    label_field: risk_level
  supported_intents:
    - wallet_analysis
    - portfolio_check
    - counterparty_assessment
    - holding_verification

on_chain:
  description: Wallet portfolio snapshot for on-chain signal data.
  transform: direct
  min_price_usdc: 0.02
  fields:
    integers:
      - index: 0
        name: total_usd_x100
        description: Total portfolio USD value times 100.
        source_path: total_usd
        multiplier: 100
    strings:
      - index: 0
        name: risk_level
        description: Wallet risk level (low/medium/high).
        source_path: risk_level
