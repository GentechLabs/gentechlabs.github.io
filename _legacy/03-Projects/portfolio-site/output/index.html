<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenTech Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p {
            color: #888;
            font-size: 1.1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .stats {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 2rem 0;
            flex-wrap: wrap;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            text-align: center;
            min-width: 150px;
        }
        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
        }
        .stat-card .label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .project-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .project-card:hover {
            transform: translateY(-4px);
            border-color: #00d4ff;
        }
        .project-card.highlight {
            border-color: #7b2cbf;
        }
        .project-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .project-card p {
            color: #aaa;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .project-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .status.live { background: #0d4a0d; color: #4ade80; }
        .status.building { background: #4a3a0d; color: #fbbf24; }
        .status.idea { background: #3a1a4a; color: #c084fc; }
        .status.complete { background: #1a3a4a; color: #67e8f9; }
        .tech-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .tech-tag {
            background: #252525;
            color: #888;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .project-links {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
        }
        .project-links a {
            color: #00d4ff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .project-links a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #555;
            border-top: 1px solid #333;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>

    </header>
    
    <div class="container">
        <div class="stats" id="stats"></div>
        <div class="projects-grid" id="projects"></div>
    </div>

    <script>
        const projects = JSON.parse(document.getElementById('project-data').textContent);
        
        // Stats
        const stats = document.getElementById('stats');
        const statuses = {};
        projects.forEach(p => {
            const s = p.status || 'unknown';
            statuses[s] = (statuses[s] || 0) + 1;
        });
        
        stats.innerHTML = `
            <div class="stat-card">
                <div class="number">${projects.length}</div>
                <div class="label">Total Projects</div>
            </div>
            ${Object.entries(statuses).map(([s, c]) => `
                <div class="stat-card">
                    <div class="number">${c}</div>
                    <div class="label">${s.charAt(0).toUpperCase() + s.slice(1)}</div>
                </div>
            `).join('')}
        `;
        
        // Projects
        const grid = document.getElementById('projects');
        grid.innerHTML = projects.map(p => `
            <div class="project-card ${p.highlight ? 'highlight' : ''}">
                <h3>${p.title}</h3>
                <p>${p.description}</p>
                <div class="project-meta">
                    <span class="status ${p.status}">${p.status}</span>
                    <span style="color: #666; font-size: 0.85rem;">${p.timeline || ''}</span>
                </div>
                <div class="tech-tags">
                    ${(p.tech || []).map(t => `<span class="tech-tag">${t}</span>`).join('')}
                </div>
                <div class="project-links">
                    ${p.github_url ? `<a href="${p.github_url}" target="_blank">GitHub →</a>` : ''}
                    ${p.live_url ? `<a href="${p.live_url}" target="_blank">Live →</a>` : ''}
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
