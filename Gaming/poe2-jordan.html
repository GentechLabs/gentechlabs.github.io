<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POE2 — Jordan's Builds</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a12;
            color: #e0ddd4;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #12121a, #1a1a2a);
            border-bottom: 2px solid #c9a84c;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 2em;
            color: #c9a84c;
            margin-bottom: 10px;
        }
        .header .subtitle {
            color: #7eb8ff;
            font-size: 1.1em;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            color: #c9a84c;
            font-size: 1.4em;
            margin-bottom: 15px;
            border-bottom: 1px solid #2a2a3a;
            padding-bottom: 10px;
        }
        .character-card {
            background: #12121a;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .character-card h3 {
            color: #c9a84c;
            font-size: 1.5em;
            margin-bottom: 8px;
        }
        .class {
            color: #7eb8ff;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .level {
            color: #e0ddd4;
            font-size: 1em;
            margin-bottom: 15px;
        }
        .stats-display {
            color: #c9a84c;
            font-size: 0.95em;
            margin-bottom: 12px;
            padding: 8px 12px;
            background: #0d0d15;
            border-radius: 6px;
        }
        .choice-badge {
            color: #ffeb3b;
            font-size: 0.9em;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #1a1a2e;
            border-radius: 6px;
            border-left: 3px solid #ffeb3b;
        }
        .section-label {
            color: #7eb8ff;
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 10px;
            margin-top: 15px;
        }
        .skill-list {
            list-style: none;
        }
        .skill-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #0d0d15;
            border-radius: 6px;
            margin-bottom: 6px;
            border-left: 3px solid #7eb8ff;
        }
        .skill-name {
            color: #e0ddd4;
            font-weight: 500;
        }
        .skill-type {
            color: #7eb8ff;
            font-size: 0.9em;
        }
        .meta-tier {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            margin-right: 10px;
        }
        .tier-s { background: #4caf50; color: white; }
        .tier-a { background: #2196f3; color: white; }
        .tier-b { background: #ff9800; color: white; }
        .build-card {
            background: #0d0d15;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .build-card h4 {
            color: #c9a84c;
            margin-bottom: 10px;
        }
        .suggestion-list {
            list-style: none;
        }
        .suggestion-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #0d0d15;
            border-radius: 6px;
            margin-bottom: 6px;
        }
        .node-name {
            color: #e0ddd4;
        }
        .node-type {
            color: #7eb8ff;
            font-size: 0.85em;
        }
        .loading {
            color: #7eb8ff;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>POE2 — Jordan's Builds</h1>
        <div class="subtitle">Lightning Invoker Monk</div>
    </div>

    <div class="container">
        <div class="section">
            <h2>My Character</h2>
            <div id="character-grid">
                <div class="loading">Loading character data...</div>
            </div>
        </div>

        <div class="section">
            <h2>Meta Builds</h2>
            <div id="meta-builds"></div>
        </div>

        <div class="section">
            <h2>Passive Tree Suggestions</h2>
            <div id="passive-suggestions"></div>
        </div>
    </div>

    <script>
        // Load character data from JSON file
        let characterData = null;

        async function loadCharacterData() {
            try {
                const response = await fetch('poe2-jordan-monk.json');
                characterData = await response.json();
                renderCharacters();
                console.log('Character data loaded:', characterData);
            } catch (error) {
                console.error('Failed to load character data:', error);
                // Fallback to hardcoded data if JSON fails
                characterData = {
                    character: {
                        id: "monk-jordan",
                        player: "Jordan",
                        alias: "Lightning Monk",
                        class: "Monk",
                        ascendancy: "Invoker",
                        level: 31,
                        act: "Act 3",
                        stats: { life: 639, energyShield: 68, mana: 224, spirit: 30, strength: 48, dexterity: 46, intelligence: 50 },
                        ascendancyPoints: { earned: 2, total: 8, source: "Trial of the Sekhemas" },
                        choices: { faith: { skill: "Meditate", description: "Heal and restore Spirit over time", unlockedAt: "Level 31" } }
                    },
                    skills: [
                        { name: "Tempest Flurry", type: "Primary Attack — Lightning", supports: ["Shock Conduction"], role: "Main damage dealer" },
                        { name: "Falling Thunder", type: "Burst — Lightning", supports: ["Elemental Armament 1"], role: "Big nuke" },
                        { name: "Mana Drain", type: "Utility", supports: ["Level 7 Wand"], role: "Mana sustain" },
                        { name: "Arc", type: "Spell — Lightning", supports: ["Shock Conduction", "Rapid Casting 1"], role: "Chain clear" },
                        { name: "Orb of Storms", type: "Sustained — Lightning", supports: ["Lightning Penetration", "Considered Casting"], role: "AoE storm" },
                        { name: "Killing Palm", type: "Attack", supports: ["Life Leech 1", "Bounty 1"], role: "Execution" },
                        { name: "Parry", type: "Counter Attack", supports: ["Retaliate 1", "Life Leech 1", "Bounty 1"], role: "Counter-attack" }
                    ],
                    damageLoop: "Tempest Flurry → shock → Arc → Orb of Storms → Falling Thunder → nuke"
                };
                renderCharacters();
            }
        }

        // Render characters
        function renderCharacters() {
            const grid = document.getElementById('character-grid');
            grid.innerHTML = '';

            if (!characterData) {
                grid.innerHTML = '<div class="loading">Loading character data...</div>';
                return;
            }

            const charInfo = characterData.character;
            const skills = characterData.skills;
            const stats = characterData.character.stats;

            const card = document.createElement('div');
            card.className = 'character-card';

            card.innerHTML = `
                <h3>${charInfo.alias}</h3>
                <div class="class">${charInfo.class} — ${charInfo.ascendancy}</div>
                <div class="level">Level ${charInfo.level} • ${charInfo.act}</div>
                ${stats.strength ? `<div class="stats-display">STR: ${stats.strength} | DEX: ${stats.dexterity} | INT: ${stats.intelligence}</div>` : ''}
                ${charInfo.choices && charInfo.choices.faith ? `
                    <div class="choice-badge">✨ ${charInfo.choices.faith.skill}</div>
                ` : ''}
                <div class="section-label">Skills</div>
                <ul class="skill-list">
                    ${skills.map(skill => `
                        <li>
                            <span class="skill-name">${skill.name}</span>
                            <span class="skill-type">${skill.type}</span>
                        </li>
                    `).join('')}
                </ul>
            `;
            grid.appendChild(card);
        }

        // Meta builds data
        const metaBuilds = {
            "Monk": [
                { name: "Lightning Invoker", tier: "S", key_skills: ["Tempest Flurry", "Falling Thunder", "Thunderstorm"], map_clear: "A", bossing: "S" },
                { name: "Ice Invoker", tier: "A", key_skills: ["Ice Crash", "Frost Blades", "Ice Nova"], map_clear: "A", bossing: "A" },
                { name: "Tempest Hybrid", tier: "A", key_skills: ["Tempest Flurry", "Storm Call", "Conductivity"], map_clear: "A", bossing: "A" }
            ],
            "Warrior": [
                { name: "Vibrant Warrior", tier: "S", key_skills: ["Sunder", "Leap Slam", "War Cry"], map_clear: "S", bossing: "A" },
                { name: "Bleed Gladiator", tier: "A", key_skills: ["Cleave", "Vulnerability", "War Cry"], map_clear: "A", bossing: "A" },
                { name: "Shield Cracker", tier: "B", key_skills: ["Shield Charge", "Consecrated Ground", "War Cry"], map_clear: "B", bossing: "A" }
            ]
        };

        // Passive tree suggestions
        const passiveSuggestions = {
            "Monk": {
                level_1_30: ["Thunder Strike", "Storm Fists", "Lightning Infusion", "Chain Lightning", "Static Charge"],
                level_31_60: ["Storm Mastery", "Volt Surge", "Arc Dancer", "Flickering Guard", "Shocked Ground"],
                level_61_90: ["Thunderlord's Decree", "Storm Ward", "Stone Bulwark", "Titan's Resolve"]
            },
            "Warrior": {
                level_1_30: ["Iron Skin", "Resilience", "Tempered Body", "Steel Will", "Unbreakable"],
                level_31_60: ["Stone Bulwark", "Endurance", "Vitality", "Hardened", "Deep Wounds"],
                level_61_90: ["Titan's Resolve", "Endurance Charge", "Grounded", "Storm Ward"]
            }
        };

        // Render meta builds
        function renderMetaBuilds() {
            const container = document.getElementById('meta-builds');
            container.innerHTML = '';

            Object.entries(metaBuilds).forEach(([className, builds]) => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <h3 style="color: #7eb8ff; margin: 20px 0 10px;">${className}</h3>
                    ${builds.map(build => `
                        <div class="build-card">
                            <h4>
                                <span class="meta-tier tier-${build.tier.toLowerCase()}">${build.tier}</span>
                                ${build.name}
                            </h4>
                            <div style="color: #e0ddd4; font-size: 0.9em;">
                                <strong>Skills:</strong> ${build.key_skills.join(', ')}<br>
                                <strong>Map Clear:</strong> ${build.map_clear} | <strong>Bossing:</strong> ${build.bossing}
                            </div>
                        </div>
                    `).join('')}
                `;
                container.appendChild(section);
            });
        }

        // Render passive suggestions
        function renderSuggestions() {
            const container = document.getElementById('passive-suggestions');
            container.innerHTML = '';

            Object.entries(passiveSuggestions).forEach(([className, suggestions]) => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <h3 style="color: #7eb8ff; margin: 20px 0 10px;">${className}</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                        <div class="build-card">
                            <h4>Level 1-30</h4>
                            <ul class="suggestion-list">
                                ${suggestions.level_1_30.map(node => `
                                    <li>
                                        <span class="node-name">${node}</span>
                                        <span class="node-type">Early Game</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                        <div class="build-card">
                            <h4>Level 31-60</h4>
                            <ul class="suggestion-list">
                                ${suggestions.level_31_60.map(node => `
                                    <li>
                                        <span class="node-name">${node}</span>
                                        <span class="node-type">Mid Game</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                        <div class="build-card">
                            <h4>Level 61-90</h4>
                            <ul class="suggestion-list">
                                ${suggestions.level_61_90.map(node => `
                                    <li>
                                        <span class="node-name">${node}</span>
                                        <span class="node-type">End Game</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
                container.appendChild(section);
            });
        }

        // Initialize
        loadCharacterData();
        renderMetaBuilds();
        renderSuggestions();
    </script>
</body>
</html>
