<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanito's Music Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
    .nav { display: flex; gap: 16px; margin-bottom: 24px; font-size: 0.85rem; }
    .nav a { color: #64748b; text-decoration: none; }
    .nav a:hover { color: #06b6d4; }
    .track-list { max-width: 500px; width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .track {
      display: flex; align-items: center; gap: 14px;
      background: #111119; border: 1px solid #1a1a2e;
      border-radius: 12px; padding: 14px 18px;
    }
    .track .num { color: #64748b; font-size: 0.85rem; font-weight: 600; width: 24px; }
    .track .info { flex: 1; }
    .track .title { font-weight: 600; font-size: 0.95rem; }
    .track .ext { color: #64748b; font-size: 0.75rem; }
    .track audio { height: 32px; }
  </style>
</head>
<body>
  <h1>🎧 Vanito's Music Vault</h1>
  <div class="subtitle">All tracks</div>
  <div class="nav">
    <a href="../Vanito/">← Vanito's Hub</a>
    <a href="../">Portfolio</a>
  </div>
  <div class="track-list">
    <div class="track">
      <div class="num">01</div>
      <div class="info"><div class="title">Fight Forever Never Quit</div><div class="ext">.mp3</div></div>
      <audio controls src="fight-forever-never-quit.mp3"></audio>
    </div>
    <div class="track">
      <div class="num">02</div>
      <div class="info"><div class="title">In the Darkness We Rise</div><div class="ext">.mp3</div></div>
      <audio controls src="in-the-darkness-we-rise.mp3"></audio>
    </div>
    <div class="track">
      <div class="num">03</div>
      <div class="info"><div class="title">Mirai e Hashire</div><div class="ext">.mp3</div></div>
      <audio controls src="mirai-e-hashire.mp3"></audio>
    </div>
  </div>
  <div class="subtitle" style="margin-top: 24px;">Vanito's tracks — GenTech Labs</div>
</body>
</html>
